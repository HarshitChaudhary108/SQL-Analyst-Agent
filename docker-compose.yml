services:
  api:
    build: .
    container_name: sql-analyst-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build: .
    container_name: sql-analyst-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - AGENT_API_URL=http://api:8000/query
    depends_on:
      - api
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]